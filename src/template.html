<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <meta name="description" content="カラスの眼を通して夜の都市を飛び、写真の浮かぶ展示室へ。ワンタッチで再生する映像体験。">
  <title>CHO KAN ZU — もうひとつの眼で。</title>
  <style>/* INLINE_STYLE */</style>
</head>
<body>
<main id="experience" aria-label="カラスの視点で夜の都市から写真展へ飛ぶ映像体験">
  <canvas id="scene" role="img" aria-label="カラスと出会うロビー、都市の飛行、夜景に浮かぶ写真展" tabindex="0"></canvas>
  <div id="darkness" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div><div id="blink" aria-hidden="true"></div>
  <header class="chrome"><div class="wordmark"><svg class="bird-mark" viewBox="0 0 32 32" aria-hidden="true" fill="none"><path d="M27 4C17 2 8 9 7 20l5 5C23 24 29 14 27 4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m4 28 18-19M10 22l-.5-7M14 18l8-.5M18 14l-.5-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> CHO KAN ZU <span class="edition">CROW STUDY / 01</span></div><nav aria-label="映像の設定"><button id="sound" aria-label="音をオンにする" aria-pressed="false">音 OFF</button><button id="clean" aria-pressed="false" title="Hキーでも表示を切り替え">表示を隠す</button></nav></header>
  <section id="intro" class="overlay" aria-labelledby="intro-title"><div class="intro-inner"><p class="eyebrow">ANOTHER EYE. ANOTHER WORLD.</p><div class="intro-rule"></div><h1 id="intro-title">もうひとつの、<br>眼で。</h1><p class="intro-copy">一羽のカラス。眠らない都市。<br>光の先に、写真が浮かぶ。</p><button id="start" class="primary" disabled><span>空間を準備しています</span></button><p class="play-note">約40秒のフライト <span>／</span> ワンタッチで自動再生</p></div><div class="intro-foot"><span>A FLIGHT INTO PHOTOGRAPHY</span><span>2026</span></div></section>
  <div id="hud" class="chrome" hidden><div id="altimeter"><span>ALTITUDE</span><strong id="altitude">000</strong><span>M</span></div></div>
  <div id="playback" class="chrome" hidden><div class="playback-row"><button id="pause" aria-label="一時停止">Ⅱ <span>一時停止</span></button><button id="restart" aria-label="最初から再生">↺ <span>最初から</span></button><span class="playback-spacer"></span><span id="time">00:00 / 00:40</span></div><input id="seek" aria-label="再生位置" type="range" min="0" max="39.5" step="0.1" value="0"></div>
  <div id="gallery-controls" class="chrome" hidden>
    <button id="move-stick" aria-label="移動スティック。ドラッグまたは矢印キーで移動" title="ドラッグで移動"><span class="stick-ring" aria-hidden="true"></span><span class="stick-knob" aria-hidden="true"></span></button>
    <button id="gallery-restart" aria-label="最初から再生">↺ 最初から</button>
  </div>
  <button id="show-ui" hidden aria-label="操作ボタンを表示">操作を表示</button>
  <p id="gallery-title" hidden>光を、持ち帰る。</p>

  <dialog id="lightbox" aria-labelledby="photo-title"><button id="close-lightbox" aria-label="拡大写真を閉じる">閉じる ×</button><img id="large-photo" alt=""><div class="lightbox-footer"><button id="previous-photo" aria-label="前の写真">←</button><div><p id="photo-title"></p></div><button id="next-photo" aria-label="次の写真">→</button></div></dialog>
  <section id="error" class="overlay" hidden><div><h2>空間を開けませんでした。</h2><p id="error-detail"></p><button class="primary" id="reload">再読み込み</button></div></section>
</main>
<script>/* INLINE_SCRIPT */</script>
</body>
</html>
